# Publish to npm whenever a tag is pushed
name: Publish to npm
on:
  push:
    tags: v*
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm and Node 24
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      # --trust-lockfile: this lockfile is committed to git and already
      # verified locally (built + tested) before being pushed, so
      # re-checking it against pnpm's minimumReleaseAge supply-chain policy
      # here is redundant and can spuriously fail CI if a pinned dependency
      # was published very recently relative to this run.
      - run: pnpm install --trust-lockfile
      - run: pnpm build
      - run: pnpm publish --no-git-checks
