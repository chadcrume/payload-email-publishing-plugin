# Publish to npm whenever a tag is pushed
name: Publish to npm
on:
  push:
    tags: v*
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm and Node 24
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - run: pnpm install
      - run: pnpm build
      - run: pnpm publish --no-git-checks
